<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
    <style>
        .page-title {
            color: red;
        }

        .is-active{
            font-weight: bold;
            color: orange;
        }
    </style>
</head>

<body>
    <h1 class="page-title">DOM</h1>
    <p class="description">DOMとはHTMLをJavaScriptで操作するための仕組みです。</p>

    <h2>Webページを構成する三大要素</h2>
    <ul class="list">

    </ul>
    <a href="https://google.co.jp" target="_blank">Google</a>
    <script>
        // h1の文字を変更する（書き換える）
        // 1.操作した要素を探す
        const pageTitle = document.querySelector('.page-title');
        console.log(pageTitle);

        // 2.操作したいプロパティを見つける
        console.log(pageTitle.textContent);

        // 3.プロパティの値を書き換える
        pageTitle.textContent = 'Document Object Model'


        //   p.descriptionのスタイルを変更する
        const description = document.querySelector('.description');
        console.log(description);

        description.style.color = '#777777';
        description.style.fontSize = '20px';
        description.style.fontWeight = 'bold';


        // // 要素の追加
        // //1. ul.listを探す
        const list = document.querySelector('ul.list');
        console.log(list);
        // // 2. li要素を生成する
        // const li = document.createElement('li');
        // // 3.li要素に「HTML」という文字列を書き込む
        // li.textContent = 'HTML';
        // // 4. ul.listの子要素にliを追加
        // list.append(li); //要素の末尾に追加
        // console.log(li);


        // const li2 = document.createElement('li');
        // li2.textContent = 'CSS';
        // list.append(li2);

        function addLiElement(text) {
            const li = document.createElement('li');
            li.textContent = text;
            list.append(li);
        }

        addLiElement('HTML');
        addLiElement('css');
        addLiElement('JavaScript');


        // aタグのリンク先とテキストをリカレントスクールのページに変更する
        const link = document.querySelector('a.link');
        link.textContent = 'リカレントスクール';
        //    href属性を書き換える
        console.log(link.href);
        link.href = 'https://sozosha-rs.jp/';

        // クラス属性の取り扱い
    console.log(link.classList);
    
    // クラス属性の追加
    link.classList.add('is-active');

    // クラス属性の削除
    link.classList.remove('is-active');

    // 要素の削除
    link.remove();
    </script>
</body>

</html>
