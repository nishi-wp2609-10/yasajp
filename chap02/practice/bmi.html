<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI計算プログラム</title>
</head>

<body>
    <h1>BMI計算プログラム</h1>
    <script>
        //1.データを用意する
        //体重
        let weight = prompt('体重入力してください。');
        //身長（ユーザーに㎝で身長を入力してほしい）
        let height = prompt('身長を入力してください。');

        //身長をｍ単位に変換
        height = height / 100;
  
        //2.データを使ってBMIを計算する
        let bmi = weight / (height * height);

        //3.alertで表示
        let message = 'あなたのBMIは「' + bmi + '」です。';
        alert(message);

/*
ブロックコメント
複数行のコメント
*/ 

    </script>
</body>

</html>
