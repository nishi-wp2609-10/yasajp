<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>練習1（変数・演算子）</title>
</head>

<body>
  <h1>練習1（変数・演算子）</h1>
  <script>
    // 各コメントと同じ文字列を、console.log() でコンソールに出力してください。
    // 数値は直接書かずに、必ず以下の変数を使ってください。
    // 計算式の答えは算術演算子を使って求め、文字列は + で連結してください。

    const num1 = 1;
    const num3 = 3;
    const num5 = 5;
    const num10 = 10;
    const num15 = 15;

    // 1 + 3 = 4
    console.log(num1);
    console.log('+');
    console.log(num3);
    console.log('=');
    console.log(num1 + num3);
    console.log(num1 + '+' + num3 + '=' + (num1 + num3));

    // テンプレート文字列
    console.log(`${num1}+${num3}=${num1 + num3}`);

    // 10 - 5 = 5
    console.log(num10 + '-' + num5 + '=' + (num10 - num5));

    // 3 × 5 = 15
    console.log(num3 + '×' + num5 + '=' + num3 * num5)
    // 15 ÷ 3 = 5 
    console.log(num15 + '÷' + num3 + '=' + num15 / num3)
    // 10 を 3 で割った余りは「1」です
    console.log(num10 + 'を' + num3 + 'で割った余りは「' + num10 % num3 + '」です')
    console.log(`${num10}を${num3}で割った余りは「${num10%num3}」です`);
  </script>
</body>

</html>
